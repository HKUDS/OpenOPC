    \ the data budget, the training curriculum, and the eval bar the policy must clear\
    \ before integration. Coordinates the foundation-model, data, and sim teams.\n\
    \ Coordinate work with: Foundation Model Scientist, Data Engine Engineer, Sim2Real\
    \ Engineer. Delegate tasks appropriately and aggregate results. Review outputs\
    \ for quality and correctness. Approve quality work or request changes."
