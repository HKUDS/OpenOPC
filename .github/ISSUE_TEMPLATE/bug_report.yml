name: Bug report
description: Report a problem with OpenOPC
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OpenOPC version/commit, Python version, OS, and relevant package versions.
      placeholder: |
        - OpenOPC:
        - Python:
        - OS:
    validations:
      required: true
